<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookly AI Concierge</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0a0a0a;
  color: #e8e8e8;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.shell {
  width: 100%;
  max-width: 720px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  border-left: 1px solid #1e1e1e;
  border-right: 1px solid #1e1e1e;
}

/* header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid #1e1e1e;
  background: #0d0d0d;
  flex-shrink: 0;
}
.hd-left { display: flex; flex-direction: column; gap: 2px; }
.hd-left .name { font-size: 15px; font-weight: 700; }
.hd-left .sub  { font-size: 12px; color: #555; }
.hd-right { display: flex; align-items: center; gap: 8px; }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #3a9e5a; box-shadow: 0 0 6px #3a9e5a88;
}
.status-txt { font-size: 12px; color: #555; }
button.new-chat {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  color: #888;
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
}
button.new-chat:hover { border-color: #444; color: #bbb; }

/* messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

.msg-row { display: flex; flex-direction: column; gap: 6px; }
.msg-row.user { align-items: flex-end; }
.msg-row.agent { align-items: flex-start; }

.bubble {
  max-width: 82%;
  padding: 11px 15px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg-row.user .bubble {
  background: #1a3554;
  border: 1px solid #1e4a7a;
  color: #c8deff;
  border-bottom-right-radius: 4px;
}
.msg-row.agent .bubble {
  background: #161616;
  border: 1px solid #242424;
  color: #e0e0e0;
  border-bottom-left-radius: 4px;
}

.tool-trace {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  max-width: 82%;
  padding-left: 2px;
}
.tool-chip {
  font-size: 11px;
  font-family: 'Consolas', 'Courier New', monospace;
  background: #111;
  border: 1px solid #252525;
  color: #555;
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
}

/* typing indicator */
.typing { display: flex; gap: 5px; align-items: center; padding: 12px 15px; }
.typing span {
  width: 6px; height: 6px; border-radius: 50%; background: #444;
  animation: bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); background: #333; }
  30% { transform: translateY(-5px); background: #666; }
}

/* input bar */
.input-bar {
  display: flex;
  gap: 10px;
  padding: 14px 20px;
  border-top: 1px solid #1e1e1e;
  background: #0d0d0d;
  flex-shrink: 0;
}
textarea {
  flex: 1;
  background: #141414;
  border: 1px solid #2a2a2a;
  border-radius: 10px;
  color: #e8e8e8;
  font-family: inherit;
  font-size: 14px;
  padding: 10px 14px;
  resize: none;
  outline: none;
  max-height: 120px;
  line-height: 1.5;
}
textarea:focus { border-color: #3a5a8a; }
textarea::placeholder { color: #444; }
button.send {
  background: #1a3a6a;
  border: 1px solid #2a5aaa;
  color: #7ab4ff;
  border-radius: 10px;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  align-self: flex-end;
}
button.send:hover { background: #1e4a8a; }
button.send:disabled { opacity: 0.35; cursor: default; }
button.send svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="hd-left">
      <span class="name">Bookly AI Concierge</span>
      <span class="sub">Aria &nbsp;&middot;&nbsp; Customer support</span>
    </div>
    <div class="hd-right">
      <span class="status-dot"></span>
      <span class="status-txt">Online</span>
      <button class="new-chat" id="btnNew">New conversation</button>
    </div>
  </header>

  <div class="messages" id="msgs"></div>

  <div class="input-bar">
    <textarea id="input" rows="1" placeholder="Ask about your order, returns, or policies…"></textarea>
    <button class="send" id="btnSend" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

</div>
<script>
  const msgs    = document.getElementById('msgs');
  const input   = document.getElementById('input');
  const btnSend = document.getElementById('btnSend');
  const btnNew  = document.getElementById('btnNew');

  let sessionId = newId();
  let busy = false;

  function newId() {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  // auto-grow textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  btnSend.addEventListener('click', send);

  btnNew.addEventListener('click', async () => {
    await fetch(`/session/${sessionId}`, { method: 'DELETE' });
    sessionId = newId();
    msgs.innerHTML = '';
    addWelcome();
  });

  function addWelcome() {
    addAgentMsg('Hi! I\'m Aria, Bookly\'s support assistant. I can help with order status, returns, refunds, and policy questions. How can I help you today?', []);
  }

  function addUserMsg(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    row.appendChild(b);
    msgs.appendChild(row);
    scrollBottom();
    return row;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row agent';
    const b = document.createElement('div');
    b.className = 'bubble';
    const t = document.createElement('div');
    t.className = 'typing';
    t.innerHTML = '<span></span><span></span><span></span>';
    b.appendChild(t);
    row.appendChild(b);
    msgs.appendChild(row);
    scrollBottom();
    return row;
  }

  function addAgentMsg(text, toolCalls) {
    const row = document.createElement('div');
    row.className = 'msg-row agent';

    if (toolCalls && toolCalls.length) {
      const trace = document.createElement('div');
      trace.className = 'tool-trace';
      toolCalls.forEach(label => {
        const chip = document.createElement('span');
        chip.className = 'tool-chip';
        chip.textContent = label;
        trace.appendChild(chip);
      });
      row.appendChild(trace);
    }

    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    row.appendChild(b);
    msgs.appendChild(row);
    scrollBottom();
  }

  function scrollBottom() {
    msgs.scrollTop = msgs.scrollHeight;
  }

  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;

    busy = true;
    btnSend.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addUserMsg(text);
    const typing = addTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });

      if (!res.ok) throw new Error('Server error ' + res.status);
      const data = await res.json();

      typing.remove();
      addAgentMsg(data.reply, data.tool_calls);
    } catch (err) {
      typing.remove();
      addAgentMsg('Something went wrong. Please try again.', []);
    } finally {
      busy = false;
      btnSend.disabled = false;
      input.focus();
    }
  }

  addWelcome();
  input.focus();
</script>
</body>
</html>
